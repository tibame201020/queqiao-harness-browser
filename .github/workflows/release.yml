name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Use OIDC-capable npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./package.json').queqiao.manifest.version")"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match queqiao.manifest.version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Verify package
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Publish to npm
        run: npm publish --access public